<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Teleprompter</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: #05070c; color: #e6e9ef;
    font: 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 5px; padding: 6px 8px; flex: 0 0 auto;
    background: #10141c; border-bottom: 1px solid #232b3d;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex: 0 0 auto; }
  .dot.ok { background: #22c55e; }
  .dot.err { background: #ef4444; }
  .est { color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    background: #1f2940; color: #fff; border: 1px solid #33405f; border-radius: 7px;
    padding: 4px 7px; cursor: pointer; font: inherit; flex: 0 0 auto;
  }
  button:hover { background: #2a3654; }
  button.main { background: #b45309; border-color: #f59e0b; font-weight: 700; }
  button.on { background: #2563eb; border-color: #3b82f6; }

  /* abas */
  .abas { display: flex; gap: 2px; padding: 5px 6px 0; background: #10141c; flex: 0 0 auto; }
  .abas button {
    border-radius: 8px 8px 0 0; border-bottom: 0; background: #151b28; color: #9fb0cc;
    padding: 5px 10px; flex: 1 1 auto;
  }
  .abas button.on { background: #05070c; color: #fff; border-color: #2a3654; }

  .vista { flex: 1 1 auto; min-height: 0; position: relative; }
  .vista[hidden] { display: none; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #0d1017; }

  .msg { padding: 5px 8px; color: #f0b429; font-size: 11px; flex: 0 0 auto; }
  .msg:empty { display: none; }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="est" id="est">verificando…</span>
    <span style="flex:1"></span>
    <button class="main" data-a="tudo" title="Pausar/retomar gravação + rolagem">⏸ Tudo</button>
    <button data-a="marcar" title="Marcar este momento no log (Alt+M)">🚩</button>
    <button data-a="olho" title="Mostrar/esconder o teleprompter sobre o StreamYard">👁</button>
    <button data-a="janela" title="Abrir em janela flutuante separada">🗔 Janela</button>
    <button data-a="aba" title="Abrir o Teleprompter em uma aba inteira">↗ Nova Aba</button>
  </div>

  <div class="abas">
    <button data-aba="prompter" class="on">Teleprompter</button>
    <button data-aba="ajustes">Ajustes</button>
    <button data-aba="log">Log</button>
  </div>

  <div class="vista" id="v-prompter"><div id="palco" style="position:absolute; inset:0"></div></div>
  <div class="vista" id="v-ajustes" hidden><iframe data-src="options.html?vista=ajustes" title="Ajustes"></iframe></div>
  <div class="vista" id="v-log" hidden><iframe data-src="options.html?vista=log" title="Registro de pausas"></iframe></div>

  <div class="msg" id="msg"></div>

  <script src="../src/shared.js"></script>
  <script src="../src/text-normalizer.js"></script>
  <script src="../src/alignment-engine.js"></script>
  <script src="../src/sync-state-machine.js"></script>
  <script src="../src/speech-recognizer.js"></script>
  <script src="../src/prompter.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
